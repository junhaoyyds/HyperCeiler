name: Build Test Branch (PR #1669)

on:
  workflow_dispatch:
  push:
    branches: ['test/**']

permissions:
  contents: read

jobs:
  build:
    name: Build test APK
    runs-on: macos-latest
    env:
      GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-overwrite-existing: true

      - name: Ensure Android SDK (API 37)
        run: |
          ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ]; then
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
            yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" || \
            yes | sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" || true
          else
            echo "sdkmanager not found; relying on the runner's preinstalled Android SDK."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK (canary)
        run: ./gradlew assembleCanary

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/canary -name '*.apk' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HyperCeiler-test-PR1669
          path: ${{ steps.apk.outputs.path }}
          compression-level: 9
