name: Nightly Build & Release

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type to release as nightly (canary/release/beta/debug)"
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - release
          - beta
          - debug
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write

jobs:
  nightly:
    name: Build Nightly APK
    runs-on: macos-latest
    env:
      GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Skip guard (no new commits)
        id: guard
        run: |
          # Manual dispatch always builds; only the scheduled run guards against no-op rebuilds.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git tag -l 'nightly-*' --sort=-creatordate | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_COMMIT=$(git rev-list -n1 "$LAST_TAG")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$LAST_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "No new commits since $LAST_TAG; skipping nightly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-overwrite-existing: true

      - name: Ensure Android SDK (API 37)
        if: steps.guard.outputs.skip != 'true'
        run: |
          ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ]; then
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
            yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" || \
            yes | sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" || true
          else
            echo "sdkmanager not found; relying on the runner's preinstalled Android SDK."
          fi

      - name: Make gradlew executable
        if: steps.guard.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Build APK
        if: steps.guard.outputs.skip != 'true'
        run: ./gradlew assemble${{ github.event.inputs.buildType || 'canary' }}

      - name: Locate APK
        id: apk
        if: steps.guard.outputs.skip != 'true'
        run: |
          BT="${{ github.event.inputs.buildType || 'canary' }}"
          APK=$(find app/build/outputs/apk/"$BT" -name '*.apk' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      # Desktop dock hook ships via source now:
      # - lib/arm64-v8a/libhyperceiler_home.so  <- app/src/main/jniLibs/
      # - META-INF/xposed/native_init.list      <- library/libhook/src/main/resources/META-INF/xposed/
      # AGP packages both natively (correct 4KB alignment + v2 signing),
      # so no post-build repack/re-sign is needed here. Post-build zip
      # rewriting (python or apksigner) realigns entries to 4 bytes and
      # breaks native lib extraction ("res=-2") — do not reintroduce it.

      - name: Generate changelog & tag
        id: clog
        if: steps.guard.outputs.skip != 'true'
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          TAG="nightly-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          BT="${{ github.event.inputs.buildType || 'canary' }}"
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          BUILDTIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')
          APKNAME="${{ steps.apk.outputs.name }}"
          PREV=$(git tag -l 'nightly-*' --sort=-creatordate | head -n1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          if [ -n "$PREV" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s (%h)" "$RANGE")
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s (%h)" -n 30)
          fi
          # fork 侧合并的上游内容（merge commit 被 --no-merges 过滤掉，单独列一份）
          if [ -n "$PREV" ]; then
            UPSTREAM_MERGES=$(git log --merges --pretty=format:"- %s (%h)" "$RANGE" | grep -E '^- Merge ' || true)
          else
            UPSTREAM_MERGES=$(git log --merges --pretty=format:"- %s (%h)" -n 30 | grep -E '^- Merge ' || true)
          fi
          # native hook 库名以 native_init.list 为准（历史上改过名，别硬编码）
          NATIVE_LIB=$(head -n1 library/libhook/src/main/resources/META-INF/xposed/native_init.list 2>/dev/null | tr -d ' \r\n')
          NATIVE_LIB=${NATIVE_LIB:-unknown}

          {
            echo "# 夜版构建日志 / Nightly Build Log"
            echo ""
            echo "## 中文（默认）"
            echo ""
            echo "- **构建类型**: \`$BT\`"
            echo "- **提交**: \`$COMMIT\`"
            echo "- **版本**: \`$VERSION\`"
            echo "- **构建时间**: $BUILDTIME"
            echo "- **产物**: \`$APKNAME\`"
            echo "- **桌面 hook native 库**: \`$NATIVE_LIB\`（经 \`META-INF/xposed/native_init.list\` 注册）"
            echo ""
            echo "### 相对上次夜版的改动（上游提交）"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "### 本次 fork 侧合并/调整"
            echo ""
            if [ -n "$UPSTREAM_MERGES" ]; then echo "$UPSTREAM_MERGES"; else echo "- （无）"; fi
            echo ""
          } > CHANGELOG.md

          {
            echo "# Nightly Build Log"
            echo ""
            echo "## English"
            echo ""
            echo "- **Build type**: \`$BT\`"
            echo "- **Commit**: \`$COMMIT\`"
            echo "- **Version**: \`$VERSION\`"
            echo "- **Build time**: $BUILDTIME"
            echo "- **Artifact**: \`$APKNAME\`"
            echo "- **Desktop dock hook native lib**: \`$NATIVE_LIB\` (registered via \`META-INF/xposed/native_init.list\`)"
            echo ""
            echo "### Changes since last nightly (upstream commits)"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "### Fork-side merges / adjustments in this build"
            echo ""
            if [ -n "$UPSTREAM_MERGES" ]; then echo "$UPSTREAM_MERGES"; else echo "- (none)"; fi
            echo ""
          } > CHANGELOG_EN.md

          {
            cat CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            cat CHANGELOG_EN.md
          } > RELEASE_NOTES.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "===== CHANGELOG.md (zh) ====="
          cat CHANGELOG.md
          echo "===== CHANGELOG_EN.md (en) ====="
          cat CHANGELOG_EN.md

      - name: Create GitHub Release (nightly)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.clog.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            CHANGELOG.md \
            CHANGELOG_EN.md \
            --title "Nightly ${{ steps.clog.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
