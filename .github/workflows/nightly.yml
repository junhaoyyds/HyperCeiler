name: Nightly Build & Release

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type to release as nightly (canary/release/beta/debug)"
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - release
          - beta
          - debug
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write

jobs:
  nightly:
    name: Build Nightly APK
    runs-on: macos-latest
    env:
      GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Skip guard (no new commits)
        id: guard
        run: |
          # Manual dispatch always builds; only the scheduled run guards against no-op rebuilds.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git tag -l 'nightly-*' --sort=-creatordate | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_COMMIT=$(git rev-list -n1 "$LAST_TAG")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$LAST_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "No new commits since $LAST_TAG; skipping nightly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-overwrite-existing: true

      - name: Ensure Android SDK (API 37)
        if: steps.guard.outputs.skip != 'true'
        run: |
          ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ]; then
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
            yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" || \
            yes | sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" || true
          else
            echo "sdkmanager not found; relying on the runner's preinstalled Android SDK."
          fi

      - name: Make gradlew executable
        if: steps.guard.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Build APK
        if: steps.guard.outputs.skip != 'true'
        run: ./gradlew assemble${{ github.event.inputs.buildType || 'canary' }}

      - name: Locate APK
        id: apk
        if: steps.guard.outputs.skip != 'true'
        run: |
          BT="${{ github.event.inputs.buildType || 'canary' }}"
          APK=$(find app/build/outputs/apk/"$BT" -name '*.apk' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Inject desktop dock hook (native_init.list) + 4KB-align .so + re-sign
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          echo "== Repack (inject native_init.list + 4KB-align STORED .so) =="
          # align_final.py: pure-python, no external zipalign needed.
          # - preserves every entry's content, forces STORED .so to 4KB page-aligned
          #   (required when extractNativeLibs is false, else install fails with
          #   "Failed to extract native libraries, res=-2")
          # - injects META-INF/xposed/native_init.list = libhyperceiler_home.so
          # - strips stale v1 signatures so jarsigner regenerates them
          python3 "${{ github.workspace }}/.github/scripts/align_final.py" "$APK" "$APK.aligned"
          mv -f "$APK.aligned" "$APK"

          echo "== Re-sign with runner debug keystore (== nightly signing key) =="
          KS=""
          for c in "$HOME/.android/debug.keystore" "${ANDROID_HOME:-}/.android/debug.keystore" "${ANDROID_SDK_HOME:-}/.android/debug.keystore" "${ANDROID_USER_HOME:-$HOME/.android}/debug.keystore"; do
            [ -f "$c" ] && KS="$c" && break
          done
          if [ -z "$KS" ]; then
            echo "debug keystore not found; generating standard AGP debug keystore"
            KS="$HOME/.android/debug.keystore"
            mkdir -p "$(dirname "$KS")"
            keytool -genkeypair -v -keystore "$KS" -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi
          echo "debug keystore: $KS"
          JS="$(command -v jarsigner || true)"
          [ -z "$JS" ] && JS="$(dirname "$(command -v java)")/jarsigner"
          [ -x "$JS" ] || JS="$JAVA_HOME/bin/jarsigner"
          SIGNED="$APK.signed"
          "$JS" -keystore "$KS" -storepass android -keypass android \
            -sigalg SHA256withRSA -digestalg SHA256 \
            -signedjar "$SIGNED" "$APK" androiddebugkey
          mv -f "$SIGNED" "$APK"
          echo "== Re-signed APK =="
          ls -la "$APK"

      - name: Generate changelog & tag
        id: clog
        if: steps.guard.outputs.skip != 'true'
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          TAG="nightly-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          BT="${{ github.event.inputs.buildType || 'canary' }}"
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          BUILDTIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')
          APKNAME="${{ steps.apk.outputs.name }}"
          PREV=$(git tag -l 'nightly-*' --sort=-creatordate | head -n1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          if [ -n "$PREV" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s (%h)" "$RANGE")
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s (%h)" -n 30)
          fi

          {
            echo "# 夜版构建日志 / Nightly Build Log"
            echo ""
            echo "## 中文（默认）"
            echo ""
            echo "- **构建类型**: \`$BT\`"
            echo "- **提交**: \`$COMMIT\`"
            echo "- **版本**: \`$VERSION\`"
            echo "- **构建时间**: $BUILDTIME"
            echo "- **产物**: \`$APKNAME\`"
            echo "- **桌面 hook**: 已内置 \`libhyperceiler_home.so\`（桌面底栏功能，经 \`META-INF/xposed/native_init.list\` 注册）"
            echo ""
            echo "### 相对上次夜版的改动"
            echo ""
            echo "$COMMITS"
            echo ""
          } > CHANGELOG.md

          {
            echo "# Nightly Build Log"
            echo ""
            echo "## English"
            echo ""
            echo "- **Build type**: \`$BT\`"
            echo "- **Commit**: \`$COMMIT\`"
            echo "- **Version**: \`$VERSION\`"
            echo "- **Build time**: $BUILDTIME"
            echo "- **Artifact**: \`$APKNAME\`"
            echo "- **Desktop dock hook**: \`libhyperceiler_home.so\` bundled (desktop bottom-bar features, registered via \`META-INF/xposed/native_init.list\`)"
            echo ""
            echo "### Changes since last nightly"
            echo ""
            echo "$COMMITS"
            echo ""
          } > CHANGELOG_EN.md

          {
            cat CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            cat CHANGELOG_EN.md
          } > RELEASE_NOTES.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "===== CHANGELOG.md (zh) ====="
          cat CHANGELOG.md
          echo "===== CHANGELOG_EN.md (en) ====="
          cat CHANGELOG_EN.md

      - name: Create GitHub Release (nightly)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.clog.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            CHANGELOG.md \
            CHANGELOG_EN.md \
            --title "Nightly ${{ steps.clog.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
